</head>
<body class="font-display bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200">
  <header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm">
    <nav class="container mx-auto flex items-center justify-between whitespace-nowrap border-b border-gray-200 dark:border-gray-800 px-6 py-4">
      <div class="flex items-center gap-4 text-gray-900 dark:text-white">
        <span class="material-symbols-outlined text-primary text-3xl">view_in_ar</span>
        <h2 class="text-xl font-bold tracking-[-0.015em]">Floorplan 3D</h2>
      </div>
      <div class="flex gap-2">
        <button data-go="index.html" class="flex min-w-[84px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold tracking-[0.015em] hover:opacity-90 transition-opacity">
          <span class="truncate">← Back to Home</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="container mx-auto px-6 py-12">
    <div class="max-w-2xl mx-auto">
      <h1 class="text-4xl font-bold mb-6 text-center">Get in Touch</h1>
      <p class="text-center text-gray-600 dark:text-gray-400 mb-12">
        Have questions? We'd love to hear from you.
      </p>

      <div class="bg-white dark:bg-gray-800 rounded-xl p-6 border border-gray-200 dark:border-gray-700 mb-8">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-xl font-bold">See What You'll Get</h2>
          <div class="flex items-center gap-4">
            <span class="text-sm font-medium text-gray-500 dark:text-gray-400">Panorama</span>
            <label class="relative inline-flex cursor-pointer items-center">
              <input class="peer sr-only" type="checkbox" id="viewer-toggle"/>
              <div class="peer h-6 w-11 rounded-full bg-gray-200 after:absolute after:start-[2px] after:top-[2px] after:h-5 after:w-5 after:rounded-full after:border after:border-gray-300 after:bg-white after:transition-all after:content-[''] peer-checked:bg-primary peer-checked:after:translate-x-full peer-checked:after:border-white dark:border-gray-600 dark:bg-gray-700"></div>
            </label>
            <span class="text-sm font-medium text-gray-500 dark:text-gray-400">3D</span>
          </div>
        </div>
        <div id="shared-viewer-container" style="width: 100%; height: 350px; position: relative; background: #f8f8f8; border-radius: 8px; overflow: hidden;">
          <canvas id="viewer-panorama-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: grab;"></canvas>
          <div id="viewer-3d-view" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none;"></div>
        </div>
      </div>

      <div class="bg-white dark:bg-gray-800 rounded-xl p-8 border border-gray-200 dark:border-gray-700">
        <form class="space-y-6">
          <div>
            <label class="block text-sm font-medium mb-2">Name</label>
            <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Your name">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2">Email</label>
            <input type="email" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-primary focus:ring-1 focus:ring-primary" placeholder="your@email.com">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2">Subject</label>
            <input type="text" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-primary focus:ring-1 focus:ring-primary" placeholder="How can we help?">
          </div>
          
          <div>
            <label class="block text-sm font-medium mb-2">Message</label>
            <textarea rows="5" class="w-full px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 focus:border-primary focus:ring-1 focus:ring-primary" placeholder="Tell us more..."></textarea>
          </div>
          
          <button type="submit" class="w-full bg-primary text-white px-6 py-3 rounded-lg font-bold hover:opacity-90 transition-opacity">
            Send Message
          </button>
        </form>
      </div>

      <div class="grid md:grid-cols-3 gap-6 mt-12">
        <div class="text-center">
          <span class="material-symbols-outlined text-primary text-3xl mb-2 block">mail</span>
          <div class="font-medium">Email</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">support@floorplan3d.com</div>
        </div>
        <div class="text-center">
          <span class="material-symbols-outlined text-primary text-3xl mb-2 block">chat</span>
          <div class="font-medium">Live Chat</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">Available 9-5 EST</div>
        </div>
        <div class="text-center">
          <span class="material-symbols-outlined text-primary text-3xl mb-2 block">help</span>
          <div class="font-medium">Help Center</div>
          <div class="text-sm text-gray-600 dark:text-gray-400">24/7 Documentation</div>
        </div>
      </div>
    </div>
  </main>

  <script type="importmap">
    {
        "imports": {
            "three": "/vendor/three/three.module.js",

            "three-mesh-bvh": "/vendor/three-mesh-bvh/index.module.js"
        }
    }
    </script>
  <script type="module" src="../assets/page-scripts/contact.js"></script>

</body>
</html>
