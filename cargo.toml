[package]
name = "blueprint3d"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
pdfium-render = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

image = "0.25"
imageproc = "0.25"

uuid = { version = "1", features = ["v4"] }

anyhow = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = "0.3"
